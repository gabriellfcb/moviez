<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moviez - Quiz do Dia</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05071a;--card:#0b1230;--borda:#2d3b7a;--cyan:#22d3ee;--ouro:#fbbf24}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:'Nunito','Segoe UI',sans-serif}
h1,h2,.btn,.opt,.logo-t,.px{font-family:'Pixelify Sans','Courier New',monospace}
/* hero */
.hero{position:relative;height:300px;overflow:hidden;text-align:center}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero-txt{position:relative;padding-top:26px;display:flex;flex-direction:column;align-items:center;gap:6px}
.kicker{font-family:'Pixelify Sans',monospace;font-size:15px;letter-spacing:5px;color:#0b2a6b;font-weight:600}
.logo-t{margin:0;font-size:clamp(56px,13vw,92px);line-height:1;color:#fde047;font-weight:700;text-shadow:0 4px 0 #d97706,0 8px 0 #4a1d06,0 0 0 #000}
.sub{margin:10px 12px 0;background:rgba(5,7,26,.6);padding:6px 14px;border-radius:4px;font-size:15px;font-weight:600}
/* layout */
.app{max-width:760px;margin:0 auto;padding:6px 16px 48px}
.err{color:#fff;background:#7f1d1d;border-radius:4px;margin:0}
.err:not(:empty){padding:12px 14px;margin-bottom:14px}
.hud{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.passos{flex:1;display:flex;gap:8px}
.passos i{flex:1;height:14px;background:#141c44;border-radius:2px;box-shadow:0 0 0 2px var(--borda)}
.passos i.atual{background:var(--ouro)}.passos i.ok{background:#22c55e}.passos i.no{background:#ef4444}
.chip{border:1px solid #94a3b8;border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.cnt{display:inline-block;border:1px solid var(--cyan);color:#67e8f9;background:rgba(34,211,238,.1);border-radius:999px;padding:4px 16px;font-weight:700;font-size:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:4px;padding:22px 18px 26px;text-align:center;box-shadow:0 0 0 3px var(--borda)}
.poster{display:none;height:190px;margin:0 auto 16px;box-shadow:0 0 0 3px var(--borda)}
.card h2{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.3;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 3px 0}
@media(max-width:520px){.opts{grid-template-columns:1fr}.hero{height:250px}}
.opt{display:flex;align-items:center;gap:12px;border:0;border-radius:4px;padding:16px 14px;font-size:19px;font-weight:600;color:#fff;text-align:left;cursor:pointer;background:#0d1736;box-shadow:0 0 0 3px var(--borda),inset 0 -4px 0 rgba(0,0,0,.4);transition:transform .08s}
.opt:hover:not(:disabled){box-shadow:0 0 0 3px var(--cyan),inset 0 -4px 0 rgba(0,0,0,.4);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt:disabled{cursor:default}
.letra{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--ouro);color:#3b1d00;border-radius:2px;font-weight:700}
.txt{flex:1}.ic{font-size:24px}
.opt.good{background:#0f3d24;box-shadow:0 0 0 3px #4ade80;animation:pulo .5s}
.opt.bad{background:#4a1220;box-shadow:0 0 0 3px #fb7185;animation:tremer .4s}
.opt.dim{opacity:.4}
.fb{margin-top:20px;border-radius:4px;padding:14px 16px;font-weight:700;font-size:17px}
.fb.good{background:#0f3d24;box-shadow:0 0 0 3px #4ade80}.fb.bad{background:#4a1220;box-shadow:0 0 0 3px #fb7185}
.btn{display:block;width:calc(100% - 6px);margin:22px 3px 0;border:0;border-radius:4px;padding:16px;font-size:20px;font-weight:700;background:var(--ouro);color:#3b1d00;cursor:pointer;box-shadow:0 0 0 3px #3b1d00,inset 0 -5px 0 #d97706}
.btn:hover{background:#fcd34d}.btn:active{transform:translateY(2px)}
.opt:focus-visible,.btn:focus-visible,.mute:focus-visible{outline:3px solid #fff;outline-offset:4px}
.mute{position:absolute;top:12px;right:12px;z-index:5;width:44px;height:44px;border:0;border-radius:4px;background:rgba(5,7,26,.65);box-shadow:0 0 0 2px var(--borda);color:#fff;font-size:20px;cursor:pointer}
.final .trofeu{font-size:80px;line-height:1;animation:pulo .8s}
.final .nota{font-family:'Pixelify Sans',monospace;font-size:64px;font-weight:700;color:#fde047;margin:6px 0}
.estrelas{font-size:38px;letter-spacing:4px;margin:2px 0 8px}
.final p{margin:6px 0}
.final .btn{width:100%;margin:18px 0 0}
.dots{display:flex;justify-content:center;gap:8px;margin:14px 0}
.dots span{width:16px;height:16px;border-radius:2px;background:#334155}
.dots .good{background:#22c55e}.dots .bad{background:#ef4444}
.conf{position:fixed;top:-20px;width:10px;height:10px;z-index:9;pointer-events:none;animation:cair linear forwards}
@keyframes pulo{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes tremer{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes cair{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice" shape-rendering="crispEdges" aria-hidden="true">
    <defs>
      <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d63d8"/><stop offset=".7" stop-color="#7fd3f5"/><stop offset="1" stop-color="#bdeefb"/></linearGradient>
      <pattern id="mato" width="24" height="16" patternUnits="userSpaceOnUse"><polygon points="0,16 0,8 4,8 4,0 8,0 8,10 12,10 12,4 16,4 16,12 20,12 20,6 24,6 24,16" fill="#05071a"/></pattern>
      <symbol id="flor" viewBox="0 0 8 16"><rect x="3" y="8" width="2" height="8" fill="#2f7a3a"/><rect x="1" y="2" width="6" height="6" fill="#e879f9"/><rect x="3" y="4" width="2" height="2" fill="#fde047"/></symbol>
      <g id="nuvem"><rect x="8" y="12" width="64" height="12" fill="#fff"/><rect x="20" y="4" width="32" height="8" fill="#fff"/><rect x="0" y="16" width="8" height="8" fill="#fff"/><rect x="8" y="24" width="64" height="4" fill="#cdeefc"/></g>
      <g id="pinho"><rect x="10" y="38" width="4" height="8" fill="#5b3a1e"/><polygon points="12,0 24,16 18,16 28,30 20,30 32,42 -8,42 4,30 -4,30 6,16 0,16" fill="#1f6b3c"/></g>
    </defs>
    <rect width="800" height="300" fill="url(#ceu)"/>
    <use href="#nuvem" x="30" y="40"/><use href="#nuvem" x="330" y="16"/><use href="#nuvem" x="590" y="44"/>
    <polygon points="-40,230 150,90 150,230" fill="#2b7a82"/><polygon points="150,90 340,230 150,230" fill="#1c5560"/><polygon points="150,90 128,106 142,102 150,112 158,102 172,106" fill="#e8f7ff"/>
    <polygon points="340,230 520,70 520,230" fill="#2b7a82"/><polygon points="520,70 700,230 520,230" fill="#1c5560"/><polygon points="520,70 496,88 512,84 520,96 528,84 544,88" fill="#e8f7ff"/>
    <polygon points="640,230 750,130 750,230" fill="#2b7a82"/><polygon points="750,130 860,230 750,230" fill="#1c5560"/>
    <rect y="205" width="800" height="100" fill="#5aac55"/><rect y="238" width="800" height="70" fill="#3f8a47"/><rect y="262" width="800" height="40" fill="#2f6f3a"/>
    <use href="#pinho" x="70" y="176"/><use href="#pinho" x="112" y="186"/><use href="#pinho" x="690" y="172"/><use href="#pinho" x="728" y="184"/>
    <use href="#flor" x="40" y="236" width="10" height="20"/><use href="#flor" x="190" y="246" width="10" height="20"/><use href="#flor" x="260" y="230" width="10" height="20"/><use href="#flor" x="560" y="240" width="10" height="20"/><use href="#flor" x="630" y="228" width="10" height="20"/><use href="#flor" x="770" y="244" width="10" height="20"/>
    <rect y="272" width="800" height="16" fill="url(#mato)"/><rect y="288" width="800" height="12" fill="#05071a"/>
  </svg>
  <button id="mudo" class="mute" aria-label="Ligar ou desligar o som" title="Som">🔊</button>
  <div class="hero-txt">
    <span class="kicker">O QUIZ DE CINEMA</span>
    <h1 class="logo-t">Moviez</h1>
    <p class="sub">A forma mais divertida de testar o quanto você manja de filmes.</p>
  </div>
</header>
<main class="app">
  <p id="status" class="err"></p>

  <section id="quiz" hidden>
    <div class="hud">
      <div id="passos" class="passos"></div>
      <span id="pontos" class="chip">⭐ 0</span>
      <span id="seq" class="chip" hidden>🔥 0</span>
    </div>
    <div class="card">
      <span id="contador" class="cnt"></span>
      <img id="poster" class="poster" alt="Pôster do filme">
      <h2 id="pergunta"></h2>
    </div>
    <div id="opcoes" class="opts"></div>
    <div id="feedback" class="fb" hidden></div>
    <button id="proxima" class="btn" hidden>Próxima ➜</button>
  </section>

  <section id="resultado" class="card final" hidden>
    <div class="trofeu" id="trofeu">🏆</div>
    <div id="nota" class="nota"></div>
    <div id="estrelas" class="estrelas"></div>
    <p id="mensagem"></p>
    <div id="bolinhas" class="dots"></div>
    <p>Volte amanhã para um novo quiz do dia!</p>
    <button id="reiniciar" class="btn">🔁 Jogar de novo (perguntas aleatórias)</button>
  </section>
</main>

<script>
const TOTAL = 10;
const TMDB_KEY = ""; // cole aqui sua chave gratuita do TMDB (themoviedb.org > Configurações > API)
const cachePosters = {};
let filmes = [], perguntas = [], atual = 0, acertos = 0, seq = 0, respondida = false, historico = [];
const $ = id => document.getElementById(id);

async function buscarPoster(f){
  if (!TMDB_KEY) return null;
  if (f.id in cachePosters) return cachePosters[f.id];
  try{
    const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=pt-BR&query=${encodeURIComponent(f.nome)}&year=${f.ano}`);
    const j = await r.json();
    const c = j.results && j.results[0] && j.results[0].poster_path;
    return cachePosters[f.id] = c ? 'https://image.tmdb.org/t/p/w342' + c : null;
  }catch(e){ return cachePosters[f.id] = null; }
}

/* ---------- efeitos sonoros (Web Audio, sem arquivos) ---------- */
let audioCtx = null, mudo = false, interagiu = false;
try { mudo = localStorage.getItem('moviez_mudo') === '1'; } catch(e){}
function ctxAudio(){
  if (!audioCtx){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; audioCtx = new A(); }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tom(freq, ini, dur, tipo = 'sine', vol = 0.15, fim = null){
  if (mudo) return;
  const c = ctxAudio(); if (!c) return;
  const t = c.currentTime + ini, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(freq, t);
  if (fim) o.frequency.exponentialRampToValueAtTime(fim, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const som = {
  hover:   () => { if (interagiu) tom(800, 0, 0.04, 'sine', 0.04); },
  clique:  () => tom(520, 0, 0.08, 'triangle', 0.12),
  proxima: () => { tom(440, 0, 0.07, 'square', 0.05); tom(660, 0.07, 0.09, 'square', 0.05); },
  acerto:  () => { tom(523, 0, 0.15, 'triangle'); tom(659, 0.1, 0.15, 'triangle'); tom(784, 0.2, 0.35, 'triangle'); },
  erro:    () => tom(220, 0, 0.4, 'sawtooth', 0.1, 90),
  fim: r => { if (r >= 0.7) [523, 659, 784, 1047].forEach((f, i) => tom(f, i * 0.14, 0.4, 'triangle', 0.15)); else [392, 330, 262].forEach((f, i) => tom(f, i * 0.2, 0.35, 'sine', 0.15)); }
};
document.addEventListener('pointerdown', () => { interagiu = true; }, { once: true });
function atualizarMudo(){ $('mudo').textContent = mudo ? '🔇' : '🔊'; }
$('mudo').onclick = () => { mudo = !mudo; try { localStorage.setItem('moviez_mudo', mudo ? '1' : '0'); } catch(e){} atualizarMudo(); som.clique(); };
atualizarMudo();

/* ---------- aleatório com semente (mesmo quiz para todos no dia) ---------- */
function seed(){ const d = new Date(); return d.getFullYear() + '' + (d.getMonth() + 1) + '' + d.getDate(); }
function criarRng(s){
  let a = 0;
  for (const c of String(s)) a = (Math.imul(a, 31) + c.charCodeAt(0)) | 0;
  return function(){ a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const embaralhar = (arr, rng) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- gerador de perguntas ---------- */
function perguntaCampo(campo, texto, filme, rng){
  const certa = filme[campo];
  const outras = [...new Set(filmes.map(f => f[campo]))].filter(v => v !== certa);
  if (outras.length < 3) return null;
  return { texto: texto.replace('{f}', filme.nome), opcoes: embaralhar([certa, ...embaralhar(outras, rng).slice(0, 3)], rng), certa, filme };
}
function perguntaAno(filme, rng){
  const anos = new Set([filme.ano]); let t = 0;
  while (anos.size < 4 && t++ < 100){ const a = filme.ano + Math.round((rng() * 2 - 1) * 14); if (a !== filme.ano && a <= new Date().getFullYear()) anos.add(a); }
  if (anos.size < 4) return null;
  return { texto: `Em que ano foi lançado «${filme.nome}»?`, opcoes: [...anos].sort((a, b) => a - b), certa: filme.ano, filme };
}
function perguntaNota(filme, rng){
  const notas = new Set([filme.nota.toFixed(1)]); let t = 0;
  while (notas.size < 4 && t++ < 200){
    const n = Math.round((filme.nota + (rng() * 2 - 1) * 1.6) * 10) / 10;
    if (n >= 1 && n <= 10 && !notas.has(n.toFixed(1)) && Math.abs(n - filme.nota) >= 0.2) notas.add(n.toFixed(1));
  }
  if (notas.size < 4) return null;
  return { texto: `Qual é a nota de «${filme.nome}»?`, opcoes: [...notas].sort((a, b) => a - b), certa: filme.nota.toFixed(1), filme };
}
function perguntaComparar(campo, texto, maior, rng){
  for (let t = 0; t < 50; t++){
    const grupo = embaralhar(filmes, rng).slice(0, 4), v = grupo.map(f => f[campo]);
    if (new Set(v).size < 4) continue;
    const alvo = maior ? Math.max(...v) : Math.min(...v), certo = grupo.find(f => f[campo] === alvo);
    return { texto, opcoes: grupo.map(f => f.nome), certa: certo.nome, filme: certo, detalhe: true, campo };
  }
  return null;
}
function montarQuiz(rng){
  const tipos = ['diretor','ano','nota','genero','diretor','ano','notaMaior','genero','diretor','ano'];
  const usados = new Set(), lista = [], pool = embaralhar(filmes, rng);
  let i = 0;
  for (const tipo of tipos.slice(0, TOTAL)){
    let p = null, t = 0;
    while (!p && t++ < 40){
      if (tipo === 'notaMaior') p = perguntaComparar('nota', 'Qual destes filmes tem a maior nota?', true, rng);
      else {
        const f = pool[i++ % pool.length];
        if (usados.has(f.id)) continue;
        if (tipo === 'ano') p = perguntaAno(f, rng);
        if (tipo === 'nota') p = perguntaNota(f, rng);
        if (tipo === 'diretor') p = perguntaCampo('diretor', 'Quem dirigiu «{f}»?', f, rng);
        if (tipo === 'genero') p = perguntaCampo('genero', 'Qual é o gênero de «{f}»?', f, rng);
        if (p) usados.add(f.id);
      }
    }
    if (p) lista.push(p);
  }
  return lista;
}

/* ---------- interface ---------- */
function atualizarPassos(){
  [...$('passos').children].forEach((el, i) => { el.className = i < historico.length ? (historico[i] ? 'ok' : 'no') : (i === atual ? 'atual' : ''); });
}
function atualizarChips(){
  $('pontos').textContent = `⭐ ${acertos}`;
  $('seq').hidden = seq < 2;
  $('seq').textContent = `🔥 ${seq}`;
}
function mostrar(){
  const p = perguntas[atual];
  respondida = false;
  $('contador').textContent = `Pergunta ${atual + 1} de ${perguntas.length}`;
  $('pergunta').textContent = p.texto;
  $('feedback').hidden = true;
  $('proxima').hidden = true;
  atualizarPassos(); atualizarChips();
  const img = $('poster');
  img.style.display = 'none'; img.removeAttribute('src');
  if (!p.detalhe) buscarPoster(p.filme).then(u => { if (u && perguntas[atual] === p){ img.src = u; img.style.display = 'block'; } });
  const box = $('opcoes');
  box.innerHTML = '';
  p.opcoes.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.dataset.v = o;
    b.innerHTML = `<span class="letra">${'ABCD'[i]}</span><span class="txt"></span><span class="ic"></span>`;
    b.querySelector('.txt').textContent = o;
    b.onclick = () => responder(b, o);
    b.onmouseenter = () => { if (!b.disabled) som.hover(); };
    box.appendChild(b);
  });
}
function responder(botao, escolha){
  if (respondida) return;
  respondida = true;
  const p = perguntas[atual], ok = String(escolha) === String(p.certa);
  if (ok){ acertos++; seq++; som.acerto(); } else { seq = 0; som.erro(); }
  historico.push(ok);
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === String(p.certa)){ b.classList.add('good'); b.querySelector('.ic').textContent = '✓'; }
    else if (b === botao){ b.classList.add('bad'); b.querySelector('.ic').textContent = '✗'; }
    else b.classList.add('dim');
  });
  const elogios = ['Boa! 🎉', 'Mandou bem! 🔥', 'Isso aí! 🙌', 'Craque! ⭐', 'Acertou em cheio! 🎯'];
  let msg = ok ? elogios[Math.floor(Math.random() * elogios.length)] : `Quase! Era ${p.certa} 😅`;
  if (p.detalhe) msg += p.campo === 'nota' ? ` «${p.filme.nome}» tem nota ${p.filme.nota}.` : '';
  const fb = $('feedback');
  fb.textContent = msg; fb.className = 'fb ' + (ok ? 'good' : 'bad'); fb.hidden = false;
  atualizarPassos(); atualizarChips();
  $('proxima').textContent = atual + 1 < perguntas.length ? 'Próxima ➜' : 'Ver resultado 🏁';
  $('proxima').hidden = false;
  $('proxima').focus();
}
function proxima(){
  atual++;
  if (atual < perguntas.length){ som.proxima(); mostrar(); } else fim();
}
function confete(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cores = ['#facc15','#4ade80','#38bdf8','#fb7185','#fff'];
  for (let i = 0; i < 60; i++){
    const c = document.createElement('i');
    c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cores[i % cores.length];
    c.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    c.style.animationDelay = Math.random() * 0.6 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}
function fim(){
  $('quiz').hidden = true;
  $('resultado').hidden = false;
  const n = perguntas.length, r = acertos / n;
  $('nota').textContent = `${acertos}/${n}`;
  $('trofeu').textContent = r >= 0.7 ? '🏆' : r >= 0.4 ? '🍿' : '🎞️';
  const e = r >= 0.9 ? 3 : r >= 0.6 ? 2 : r >= 0.3 ? 1 : 0;
  $('estrelas').textContent = '⭐'.repeat(e) + '☆'.repeat(3 - e);
  $('mensagem').textContent = r === 1 ? 'Perfeito! Você é um verdadeiro cinéfilo!' : r >= 0.7 ? 'Mandou bem! Você manja de cinema!' : r >= 0.4 ? 'Na média. Dá pra melhorar amanhã!' : 'Hora de maratonar uns filmes!';
  $('bolinhas').innerHTML = historico.map(ok => `<span class="${ok ? 'good' : 'bad'}"></span>`).join('');
  som.fim(r);
  if (r >= 0.7) confete();
}
function comecar(rng){
  perguntas = montarQuiz(rng);
  atual = 0; acertos = 0; seq = 0; historico = [];
  $('passos').innerHTML = perguntas.map(() => '<i></i>').join('');
  $('resultado').hidden = true;
  $('quiz').hidden = false;
  mostrar();
}
async function iniciar(){
  try{
    const r = await fetch('filmes.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    filmes = await r.json();
    if (!Array.isArray(filmes) || filmes.length < 10) throw new Error('filmes.json vazio ou inválido');
    comecar(criarRng(seed()));
  }catch(err){
    console.error('Erro ao carregar filmes.json:', err);
    $('status').textContent = '⚠️ Não foi possível carregar filmes.json. Verifique se o arquivo está na mesma pasta e abra o site por um servidor (não direto do arquivo).';
  }
}
$('proxima').onclick = proxima;
$('reiniciar').onclick = () => { som.clique(); comecar(criarRng(Math.random())); };
document.querySelectorAll('.btn').forEach(b => b.addEventListener('mouseenter', som.hover));
iniciar();
</script>
</body>
