<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moviez - Quiz do Dia</title>
<style>
:root{--bg:#0b0b0f;--card:#18181c;--line:#2a2a30;--red:#e50914;--txt:#fff;--mute:#aaa;--ok:#16a34a;--no:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;align-items:center;padding:30px 16px}
h1{color:var(--red);font-size:42px;margin:0}
.subtitle{color:var(--mute);margin:6px 0 24px}
.box{max-width:700px;width:100%}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.q{font-size:22px;line-height:1.35;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{padding:15px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;text-align:left;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){background:var(--red)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.opt:disabled{cursor:default}
.opt.good{background:var(--ok)!important;border-color:var(--ok)}
.opt.bad{background:var(--no)!important;border-color:var(--no)}
.opt.dim{opacity:.5}
.fb{min-height:24px;margin:16px 0 0;color:var(--mute)}
.btn{margin-top:14px;padding:14px 22px;border:0;border-radius:8px;background:var(--red);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;display:none}
.result{display:none;background:linear-gradient(135deg,#e50914,#7f0a10);border-radius:12px;padding:26px;text-align:center}
.result .score{font-size:56px;font-weight:bold;margin:6px 0}
.result p{margin:6px 0}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0}
.dots span{width:14px;height:14px;border-radius:50%;background:#fff3}
.dots .good{background:var(--ok)}.dots .bad{background:var(--no)}
.result .btn{display:inline-block;background:#fff;color:#7f0a10}
.err{color:#f87171}
.mute{position:fixed;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:#fff;font-size:18px;cursor:pointer}
.mute:hover{background:var(--red)}
.qrow{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.qrow .q{margin:0}
.poster{width:110px;border-radius:6px;display:none;flex-shrink:0}
</style>
</head>
<body>
<button id="mudo" class="mute" aria-label="Ligar ou desligar o som" title="Som">🔊</button>
<h1>🎬 MOVIEZ</h1>
<p class="subtitle">O quiz de cinema de hoje: 10 perguntas</p>

<div class="box">
  <p id="status" class="err"></p>

  <div id="inicio" class="result">
    <div style="font-size:64px;line-height:1">🎬</div>
    <h2>Pronto para o quiz do dia?</h2>
    <p>10 perguntas sobre diretor, ano, gênero e nota dos filmes. Um quiz novo todos os dias!</p>
    <button id="btnIniciar" class="btn">▶ Iniciar quiz</button>
  </div>

  <div id="quiz" style="display:none">
    <div class="top"><span id="contador"></span><span id="pontos"></span></div>
    <div class="bar"><i id="progresso"></i></div>
    <div class="qrow"><img id="poster" class="poster" alt="Pôster do filme"><h2 id="pergunta" class="q"></h2></div>
    <div id="opcoes" class="opts"></div>
    <p id="feedback" class="fb"></p>
    <button id="proxima" class="btn">Próxima</button>
  </div>

  <div id="resultado" class="result">
    <h2>🎉 Fim do quiz!</h2>
    <div id="nota" class="score"></div>
    <p id="mensagem"></p>
    <div id="bolinhas" class="dots"></div>
    <p>Volte amanhã para um novo quiz do dia.</p>
    <button id="reiniciar" class="btn">Jogar de novo (perguntas aleatórias)</button>
  </div>
</div>

<script>
const TOTAL = 10;
const TMDB_KEY = ""; // cole aqui sua chave gratuita do TMDB (themoviedb.org > Configurações > API)
const cachePosters = {};
async function buscarPoster(f){
  if (!TMDB_KEY) return null;
  if (f.id in cachePosters) return cachePosters[f.id];
  try{
    const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=pt-BR&query=${encodeURIComponent(f.nome)}&year=${f.ano}`;
    const r = await fetch(url);
    const j = await r.json();
    const caminho = j.results && j.results[0] && j.results[0].poster_path;
    return cachePosters[f.id] = caminho ? 'https://image.tmdb.org/t/p/w342' + caminho : null;
  }catch(e){ return cachePosters[f.id] = null; }
}
let filmes = [], perguntas = [], atual = 0, acertos = 0, respondida = false, historico = [];

const $ = id => document.getElementById(id);

/* ---------- efeitos sonoros (sintetizados com Web Audio, sem arquivos) ---------- */
let audioCtx = null, mudo = false, interagiu = false;
try { mudo = localStorage.getItem('moviez_mudo') === '1'; } catch(e){}
function ctxAudio(){
  if (!audioCtx){
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return null;
    audioCtx = new A();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tom(freq, ini, dur, tipo = 'sine', vol = 0.15, fim = null){
  if (mudo) return;
  const c = ctxAudio();
  if (!c) return;
  const t = c.currentTime + ini;
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t);
  if (fim) o.frequency.exponentialRampToValueAtTime(fim, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
const som = {
  hover:   () => { if (interagiu) tom(800, 0, 0.04, 'sine', 0.04); },
  clique:  () => tom(520, 0, 0.08, 'triangle', 0.12),
  proxima: () => { tom(440, 0, 0.07, 'square', 0.05); tom(660, 0.07, 0.09, 'square', 0.05); },
  acerto:  () => { tom(523, 0, 0.15, 'triangle'); tom(659, 0.1, 0.15, 'triangle'); tom(784, 0.2, 0.35, 'triangle'); },
  erro:    () => tom(220, 0, 0.4, 'sawtooth', 0.1, 90),
  fim: r => {
    if (r >= 0.7) [523, 659, 784, 1047].forEach((f, i) => tom(f, i * 0.14, 0.4, 'triangle', 0.15));
    else [392, 330, 262].forEach((f, i) => tom(f, i * 0.2, 0.35, 'sine', 0.15));
  }
};
document.addEventListener('pointerdown', () => { interagiu = true; }, { once: true });
function atualizarMudo(){ $('mudo').textContent = mudo ? '🔇' : '🔊'; }
$('mudo').onclick = () => {
  mudo = !mudo;
  try { localStorage.setItem('moviez_mudo', mudo ? '1' : '0'); } catch(e){}
  atualizarMudo();
  som.clique();
};
atualizarMudo();

/* ---------- aleatório com semente (mesmo quiz para todos no mesmo dia) ---------- */
function seed(){
  const d = new Date();
  return d.getFullYear() + '' + (d.getMonth() + 1) + '' + d.getDate();
}
function criarRng(s){
  let a = 0;
  for (const c of String(s)) a = (Math.imul(a, 31) + c.charCodeAt(0)) | 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const embaralhar = (arr, rng) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* ---------- gerador de perguntas ---------- */
function perguntaCampo(campo, texto, filme, rng){
  const certa = filme[campo];
  const outras = [...new Set(filmes.map(f => f[campo]))].filter(v => v !== certa);
  if (outras.length < 3) return null;
  return { texto: texto.replace('{f}', filme.nome), opcoes: embaralhar([certa, ...embaralhar(outras, rng).slice(0, 3)], rng), certa, filme };
}
function perguntaAno(filme, rng){
  const anos = new Set([filme.ano]);
  let tentativas = 0;
  while (anos.size < 4 && tentativas++ < 100){
    const a = filme.ano + Math.round((rng() * 2 - 1) * 14);
    if (a !== filme.ano && a <= new Date().getFullYear()) anos.add(a);
  }
  if (anos.size < 4) return null;
  return { texto: `Em que ano foi lançado «${filme.nome}»?`, opcoes: [...anos].sort((a, b) => a - b), certa: filme.ano, filme };
}
function perguntaNota(filme, rng){
  const notas = new Set([filme.nota.toFixed(1)]);
  let tentativas = 0;
  while (notas.size < 4 && tentativas++ < 200){
    const n = Math.round((filme.nota + (rng() * 2 - 1) * 1.6) * 10) / 10;
    const txt = n.toFixed(1);
    if (n >= 1 && n <= 10 && !notas.has(txt) && Math.abs(n - filme.nota) >= 0.2) notas.add(txt);
  }
  if (notas.size < 4) return null;
  return { texto: `Qual é a nota de «${filme.nome}»?`, opcoes: [...notas].sort((a, b) => a - b), certa: filme.nota.toFixed(1), filme };
}
function perguntaComparar(campo, texto, maior, rng){
  for (let t = 0; t < 50; t++){
    const grupo = embaralhar(filmes, rng).slice(0, 4);
    const valores = grupo.map(f => f[campo]);
    if (new Set(valores).size < 4) continue;
    const alvo = maior ? Math.max(...valores) : Math.min(...valores);
    const certo = grupo.find(f => f[campo] === alvo);
    return { texto, opcoes: grupo.map(f => f.nome), certa: certo.nome, filme: certo, detalhe: true, campo };
  }
  return null;
}

function montarQuiz(rng){
  const tipos = ['diretor','ano','nota','genero','diretor','ano','notaMaior','genero','diretor','ano'];
  const usados = new Set(), lista = [];
  const pool = embaralhar(filmes, rng);
  let i = 0;
  for (const tipo of tipos.slice(0, TOTAL)){
    let p = null, tentativas = 0;
    while (!p && tentativas++ < 40){
      if (tipo === 'notaMaior') p = perguntaComparar('nota', 'Qual destes filmes tem a maior nota?', true, rng);
      else {
        const f = pool[i++ % pool.length];
        if (usados.has(f.id)) continue;
        if (tipo === 'ano') p = perguntaAno(f, rng);
        if (tipo === 'diretor') p = perguntaCampo('diretor', 'Quem dirigiu «{f}»?', f, rng);
        if (tipo === 'nota') p = perguntaNota(f, rng);
        if (tipo === 'genero') p = perguntaCampo('genero', 'Qual é o gênero de «{f}»?', f, rng);
        if (p) usados.add(f.id);
      }
    }
    if (p) lista.push(p);
  }
  return lista;
}

/* ---------- interface ---------- */
function mostrar(){
  const p = perguntas[atual];
  respondida = false;
  $('contador').textContent = `Pergunta ${atual + 1} de ${perguntas.length}`;
  $('pontos').textContent = `Acertos: ${acertos}`;
  $('progresso').style.width = (atual / perguntas.length * 100) + '%';
  $('pergunta').textContent = p.texto;
  const img = $('poster');
  img.style.display = 'none';
  img.removeAttribute('src');
  if (!p.detalhe) buscarPoster(p.filme).then(u => { if (u && perguntas[atual] === p){ img.src = u; img.style.display = 'block'; } });
  $('feedback').textContent = '';
  $('proxima').style.display = 'none';
  const box = $('opcoes');
  box.innerHTML = '';
  p.opcoes.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o;
    b.onclick = () => responder(b, o);
    b.onmouseenter = () => { if (!b.disabled) som.hover(); };
    box.appendChild(b);
  });
}

function responder(botao, escolha){
  if (respondida) return;
  respondida = true;
  const p = perguntas[atual];
  const ok = escolha === p.certa;
  if (ok) acertos++;
  historico.push(ok);
  if (ok) som.acerto(); else som.erro();
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.textContent == p.certa) b.classList.add('good');
    else if (b === botao) b.classList.add('bad');
    else b.classList.add('dim');
  });
  const f = p.filme;
  let info = ok ? '✅ Acertou!' : '❌ Não foi dessa vez.';
  if (p.detalhe) info += p.campo === 'nota' ? ` «${f.nome}» tem nota ${f.nota}.` : ` «${f.nome}» é de ${f.ano}.`;
  $('feedback').textContent = info;
  $('pontos').textContent = `Acertos: ${acertos}`;
  $('proxima').textContent = atual + 1 < perguntas.length ? 'Próxima' : 'Ver resultado';
  $('proxima').style.display = 'inline-block';
  $('proxima').focus();
}

function proxima(){
  atual++;
  if (atual < perguntas.length){ som.proxima(); mostrar(); } else fim();
}

function fim(){
  $('quiz').style.display = 'none';
  $('resultado').style.display = 'block';
  $('nota').textContent = `${acertos}/${perguntas.length}`;
  const r = acertos / perguntas.length;
  som.fim(r);
  $('mensagem').textContent = r === 1 ? 'Perfeito! Você é um verdadeiro cinéfilo.' : r >= 0.7 ? 'Mandou bem! Conhece muito de cinema.' : r >= 0.4 ? 'Na média. Dá pra melhorar amanhã.' : 'Hora de maratonar uns filmes!';
  $('bolinhas').innerHTML = historico.map(ok => `<span class="${ok ? 'good' : 'bad'}"></span>`).join('');
  $('reiniciar').style.display = 'inline-block';
}

function comecar(rng){
  perguntas = montarQuiz(rng);
  atual = 0; acertos = 0; historico = [];
  $('resultado').style.display = 'none';
  $('quiz').style.display = 'block';
  mostrar();
}

async function iniciar(){
  try{
    const r = await fetch('filmes.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    filmes = await r.json();
    if (!Array.isArray(filmes) || filmes.length < 10) throw new Error('filmes.json vazio ou inválido');
    $('inicio').style.display = 'block';
  }catch(err){
    console.error('Erro ao carregar filmes.json:', err);
    $('status').textContent = '⚠️ Não foi possível carregar filmes.json. Verifique se o arquivo está na mesma pasta e abra o site por um servidor (não direto do arquivo).';
  }
}

$('btnIniciar').onclick = () => { som.clique(); $('inicio').style.display = 'none'; comecar(criarRng(seed())); };
$('proxima').onclick = proxima;
$('reiniciar').onclick = () => { som.clique(); comecar(criarRng(Math.random())); };
document.querySelectorAll('.btn').forEach(b => b.addEventListener('mouseenter', som.hover));
iniciar();
</script>
</body>
</html>
